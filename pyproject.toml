[project]
name = "nutti-playground"
version = "0.1.0"
description = "누띠 강아지 사진 놀이터 — 백엔드 (FastAPI + Tortoise ORM)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "tortoise-orm[asyncpg]>=0.21",
    "aerich>=0.7",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "pillow>=10.4",
    "openai>=1.50",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "boto3>=1.43.67",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# var/ holds runtime artifacts (local media fallback storage, etc.), never test sources.
# ponytail: explicitly listing norecursedirs replaces pytest's built-in default (which
# already excludes dot-dirs via ".*") instead of extending it — keep ".*" here too so
# stray dot-prefixed dirs (broken-permission leftovers included) never break collection.
norecursedirs = ["var", ".*"]

[tool.aerich]
tortoise_orm = "app.settings.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
