services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nutti
      POSTGRES_PASSWORD: nutti
      POSTGRES_DB: nutti
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutti"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
